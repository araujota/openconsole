name: runtime-ci
on: [push, pull_request]
permissions: { contents: read }
jobs:
  verify:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-analyzer.txt
      - run: sudo apt-get update && sudo apt-get install --yes clang binutils make libssl-dev rustc
      - run: python -m pip install --requirement requirements-analyzer.txt
      - run: make test-host check-examples check-efi-core ANALYZER_PYTHON=python
      - run: make test-analyzer ANALYZER_PYTHON=python
      - run: python scripts/generate-release-metadata.py
      - run: git diff --exit-code -- THIRD_PARTY_NOTICES.md dependency-provenance.json sbom.cdx.json
